<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>출결 관리 — 관산중</title>
  <meta name="description" content="출결 기록과 결석신고서 출력을 한곳에서.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- 신고서 대체 글꼴: 굴림·함초롬돋움·함초롬바탕이 없는 기기용 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo&display=swap">
  <link rel="stylesheet" href="theme.css?v=2610222355">
  <link rel="stylesheet" href="app.css?v=2610222355">
  <link rel="stylesheet" href="sheet.css?v=2610222355">
</head>
<body>

<svg width="0" height="0" style="position:absolute;">
  <defs>
    <symbol id="ic-close" viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="ic-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="ic-left" viewBox="0 0 24 24"><polyline points="15,5 8,12 15,19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-right" viewBox="0 0 24 24"><polyline points="9,5 16,12 9,19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-print" viewBox="0 0 24 24"><path d="M7 9V4h10v5M7 17H5a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><rect x="7" y="14" width="10" height="6" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="ic-upload" viewBox="0 0 24 24"><path d="M12 15.5V5M12 5 7.5 9.5M12 5l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 16v2.5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="ic-download" viewBox="0 0 24 24"><path d="M12 4v10.5M12 14.5 7.5 10M12 14.5 16.5 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 16v2.5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="ic-doc" viewBox="0 0 24 24"><path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M14 3v4h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<nav class="nav noprint">
  <span class="nav-brand"><img src="logo.png" alt="kakainfo"><span class="nav-brand-title">출결 관리</span></span>
  <button class="class-pill hidden" id="classPill" title="반 바꾸기"></button>
  <div class="nav-right">
    <span class="nav-email" id="navEmail"></span>
    <button class="btn sm ghost hidden" id="btnLogout">로그아웃</button>
    <div class="dark-toggle" id="darkToggle" title="다크모드" role="button" tabindex="0"></div>
  </div>
</nav>

<main class="wrap noprint" id="app">
  <div class="center-msg" id="boot">불러오는 중…</div>
</main>

<!-- 모달 자리 -->
<div class="modal-back hidden noprint" id="modal"><div class="modal-card" id="modalCard"></div></div>

<!-- PC: 출결 기록 오른쪽 칸 — #app 밖에 두어, 목록이 다시 그려져도 고치던 신고서가 남는다 -->
<aside class="side-pane hidden noprint" id="sidePane"></aside>

<!-- 신고서 편집(전체 화면) -->
<div class="editor hidden noprint" id="editor"></div>

<!-- 인쇄할 때만 보인다 -->
<div id="printArea"></div>

<div class="toast" id="toast"></div>

<script type="module" src="app.js?v=2610222355"></script>
</body>
</html>
